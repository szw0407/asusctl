name: Build on Debian 13

# Compile-check the whole workspace against the oldest supported toolchain:
# Debian 13 (trixie) ships rustc/cargo 1.85 from apt (no rustup involved), which
# matches the MSRV-oriented dependency pins in Cargo.lock.
on:
    push:
        branches: ["main"]
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: debian-13-${{ github.ref }}
    cancel-in-progress: true

env:
    CARGO_TERM_COLOR: always

jobs:
    build:
        name: cargo build --workspace (Debian 13 / rustc 1.85)
        runs-on: ubuntu-latest
        container:
            image: debian:trixie
        steps:
            - name: Install dependencies
              run: |
                  apt-get update
                  apt-get install -y --no-install-recommends \
                      ca-certificates \
                      git \
                      build-essential \
                      pkg-config \
                      cmake \
                      gettext \
                      rustc \
                      cargo \
                      libudev-dev \
                      libusb-1.0-0-dev \
                      libclang-dev \
                      libsdl2-dev

            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Show toolchain
              run: |
                  rustc --version
                  cargo --version

            - name: Build workspace
              run: cargo build --workspace --all-targets --locked